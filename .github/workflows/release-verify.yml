name: toil-release-verify

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: toil-release-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Check manifest is up to date (v1.0)
        run: python3 tools/build_release_manifest.py --version 1.0 --check

      - name: Verify TOIL release integrity (v1.0)
        run: python3 tools/verify_release.py --version 1.0
